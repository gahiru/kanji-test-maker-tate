name: Increase punctuation size again

on:
  push:
    branches:
      - codex/support-12-questions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/support-12-questions
      - name: Patch punctuation size again
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("var base = mm(4.35) + adjust;", "var base = mm(4.50) + adjust;"),
              ("var maxSize = isKuten ? mm(5.38) : mm(5.12);", "var maxSize = isKuten ? mm(5.70) : mm(5.12);"),
              ("var boxRatio = isKuten ? 1.12 : 1.06;", "var boxRatio = isKuten ? 1.19 : 1.06;"),
              ("if (String(text || '').indexOf('。') >= 0) { return mm(0.40); }", "if (String(text || '').indexOf('。') >= 0) { return mm(0.50); }"),
              ("var suffixReserve = suffix ? getUnifiedPunctuationBoxHeight(style, mm(4.45)) : 0;", "var suffixReserve = suffix ? getUnifiedPunctuationBoxHeight(style, mm(4.60)) : 0;"),
              ("var punctBoxH = getUnifiedPunctuationBoxHeight(style, mm(4.45));", "var punctBoxH = getUnifiedPunctuationBoxHeight(style, mm(4.60));"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'target not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/increase-kuten-size-again.yml').unlink()
          PY
      - name: Commit punctuation size increase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/increase-kuten-size-again.yml
          git commit -m "Increase punctuation marker size"
          git push origin HEAD:codex/support-12-questions
