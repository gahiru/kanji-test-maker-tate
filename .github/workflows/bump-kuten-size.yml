name: Bump punctuation size

on:
  push:
    branches:
      - codex/support-12-questions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/support-12-questions
      - name: Patch punctuation size
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("var base = mm(4.25) + adjust;", "var base = mm(4.35) + adjust;"),
              ("function getUnifiedPunctuationFontSize(style, boxH) {\n  var adjust = clampValue((style && style.sizeAdjustPx || 0) * 0.10, -mm(0.22), mm(0.28));\n  return Math.max(mm(2.35), Math.min(mm(5.12) + adjust, boxH * 1.06));\n}", "function getUnifiedPunctuationFontSize(style, boxH, text) {\n  var adjust = clampValue((style && style.sizeAdjustPx || 0) * 0.10, -mm(0.22), mm(0.28));\n  var isKuten = String(text || '').indexOf('。') >= 0;\n  var maxSize = isKuten ? mm(5.38) : mm(5.12);\n  var boxRatio = isKuten ? 1.12 : 1.06;\n  return Math.max(mm(2.35), Math.min(maxSize + adjust, boxH * boxRatio));\n}"),
              ("if (String(text || '').indexOf('。') >= 0) { return mm(0.30); }", "if (String(text || '').indexOf('。') >= 0) { return mm(0.40); }"),
              ("}, getUnifiedPunctuationFontSize(style, actualH));", "}, getUnifiedPunctuationFontSize(style, actualH, text));"),
              ("var suffixReserve = suffix ? getUnifiedPunctuationBoxHeight(style, mm(4.25)) : 0;", "var suffixReserve = suffix ? getUnifiedPunctuationBoxHeight(style, mm(4.45)) : 0;"),
              ("var punctBoxH = getUnifiedPunctuationBoxHeight(style, mm(4.25));", "var punctBoxH = getUnifiedPunctuationBoxHeight(style, mm(4.45));"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'target not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/bump-kuten-size.yml').unlink()
          PY
      - name: Commit punctuation size bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bump-kuten-size.yml
          git commit -m "Make punctuation marker slightly larger"
          git push origin HEAD:codex/support-12-questions
