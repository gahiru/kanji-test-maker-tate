name: Apply punctuation adjustment

on:
  push:
    branches:
      - codex/support-12-questions

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/support-12-questions
      - name: Patch punctuation rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """function getUnifiedPunctuationBoxHeight(style, availableH) {
  var adjust = clampValue((style && style.sizeAdjustPx || 0) * 0.08, -mm(0.18), mm(0.22));
  var base = mm(4.15) + adjust;
  if (availableH == null) { return base; }
  return Math.max(mm(2.35), Math.min(base, availableH));
}

function getUnifiedPunctuationFontSize(style, boxH) {
  var adjust = clampValue((style && style.sizeAdjustPx || 0) * 0.10, -mm(0.22), mm(0.28));
  return Math.max(mm(2.35), Math.min(mm(4.90) + adjust, boxH * 0.98));
}

function getUnifiedPunctuationShift(laneW) {
  return Math.min(mm(1.48), Math.max(mm(0.76), laneW * 0.15));
}

function drawUnifiedPunctuation(ctx, text, centerX, topY, boxH, laneW, style, color) {
  if (!text) { return; }
  var actualH = getUnifiedPunctuationBoxHeight(style, boxH);
  var drawY = topY + Math.max(0, boxH - actualH);
  drawVerticalText(ctx, text, centerX + getUnifiedPunctuationShift(laneW), drawY, actualH, {
    fontSize: getUnifiedPunctuationFontSize(style, actualH),
    minFontSize: mm(2.0),
    padding: 0,
    color: color || '#111',
    weight: '400',
    stepRatio: 0.92,
    fitRatio: 0.96,
    maxWidth: laneW - mm(0.10),
    fontFamily: style.printFont,
    sizeAdjust: 0,
    verticalAlign: 'center'
  });
}
"""
          new = """function getUnifiedPunctuationBoxHeight(style, availableH) {
  var adjust = clampValue((style && style.sizeAdjustPx || 0) * 0.08, -mm(0.18), mm(0.22));
  var base = mm(4.25) + adjust;
  if (availableH == null) { return base; }
  return Math.max(mm(2.35), Math.min(base, availableH));
}

function getUnifiedPunctuationFontSize(style, boxH) {
  var adjust = clampValue((style && style.sizeAdjustPx || 0) * 0.10, -mm(0.22), mm(0.28));
  return Math.max(mm(2.35), Math.min(mm(5.12) + adjust, boxH * 1.06));
}

function getUnifiedPunctuationShift(laneW) {
  return Math.min(mm(1.48), Math.max(mm(0.76), laneW * 0.15));
}

function getUnifiedPunctuationYOffset(text) {
  if (String(text || '').indexOf('。') >= 0) { return mm(0.30); }
  return mm(0.22);
}

function drawUnifiedPunctuation(ctx, text, centerX, topY, boxH, laneW, style, color) {
  if (!text) { return; }
  var actualH = getUnifiedPunctuationBoxHeight(style, boxH);
  var drawY = topY + Math.max(0, boxH - actualH) + getUnifiedPunctuationYOffset(text);
  drawVerticalTextFixedSize(ctx, text, centerX + getUnifiedPunctuationShift(laneW), drawY, actualH, {
    padding: 0,
    color: color || '#111',
    weight: '400',
    fontFamily: style.printFont
  }, getUnifiedPunctuationFontSize(style, actualH));
}
"""
          if old not in s:
              raise SystemExit('punctuation block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/apply-punctuation-adjustment.yml').unlink()
          PY
      - name: Commit punctuation adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-punctuation-adjustment.yml
          git commit -m "Adjust punctuation rendering"
          git push origin HEAD:codex/support-12-questions
