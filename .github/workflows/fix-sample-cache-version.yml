name: Fix sample cache version

on:
  push:
    branches:
      - codex/support-12-questions

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/support-12-questions
      - name: Fix cache version and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "PRACTICE_SAMPLE_RELATIVE_PATH + '?v=1.01'"
          new = "PRACTICE_SAMPLE_RELATIVE_PATH + '?v=1.02'"
          if old not in s:
              raise SystemExit('target string not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          Path('.github/workflows/fix-sample-cache-version.yml').unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-sample-cache-version.yml
          git commit -m "Update sample cache version"
          git push origin HEAD:codex/support-12-questions
